<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="48x48" />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon-48.png"
      sizes="48x48"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/app-icon-512.png"
      sizes="512x512"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      href="/images/app-icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="نالش" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="نالش" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>بوابة التاجر | نالش (Nalsh)</title>
    <meta
      name="description"
      content="بوابة التاجر لإدارة المنتجات والطلبات وإعدادات المتجر في نالش."
    />
    <meta name="robots" content="noindex, follow" />
    <style>
      #startup-intro {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111827;
      }

      #startup-intro svg {
        width: 3.75rem;
        height: 3.75rem;
        overflow: visible;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 10;
      }

      #startup-intro path {
        stroke-dasharray: 180;
        stroke-dashoffset: 180;
        opacity: 0;
        animation: startup-intro-mark 780ms cubic-bezier(0.16, 1, 0.3, 1)
          infinite;
      }

      #startup-intro circle {
        fill: currentColor;
        stroke: none;
        opacity: 0;
        animation: startup-intro-dot 780ms cubic-bezier(0.16, 1, 0.3, 1)
          infinite;
      }

      @keyframes startup-intro-mark {
        0%,
        10% {
          stroke-dashoffset: 180;
          opacity: 0;
        }
        16% {
          opacity: 1;
        }
        56%,
        72% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        88%,
        100% {
          stroke-dashoffset: 180;
          opacity: 0;
        }
      }

      @keyframes startup-intro-dot {
        0%,
        26% {
          opacity: 0;
          transform: translateY(-12px) scale(0.78);
        }
        48%,
        72% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        88%,
        100% {
          opacity: 0;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-color-scheme: dark) {
        #startup-intro {
          background: #09090b;
          color: #fafafa;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-intro path {
          stroke-dashoffset: 0;
          opacity: 1;
          animation: none;
        }

        #startup-intro circle {
          opacity: 1;
          transform: none;
          animation: none;
        }
      }
    </style>

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="startup-intro" aria-hidden="true">
      <svg viewBox="0 0 100 100" focusable="false">
        <path d="M22 38 Q22 82 50 82 Q78 82 78 38" />
        <circle cx="50" cy="16" r="7" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
